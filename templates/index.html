<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spelling B</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Spelling B home"><span>Spelling</span> B <span class="brand-bee" aria-hidden="true">🐝</span></a>
    <nav class="topnav" aria-label="Main navigation"><a href="/test">Test</a><a href="/progress">Progress</a><a class="icon-link" href="/settings" aria-label="Open settings" title="Settings">⚙</a></nav>
  </header>

  <main class="practice-shell">
    <section class="practice-card kid-card" aria-labelledby="list-title">
      <div class="card-sparkles" aria-hidden="true"><span>★</span><span>●</span><span>★</span></div>
      <div class="list-picker">
        <label for="list-select">My word list</label>
        <select id="list-select">
          {{range $index, $list := .Config.Lists}}<option value="{{$index}}">{{$list.Title}}</option>{{end}}
        </select>
      </div>

      <div class="session-meta"><p id="level-label" class="eyebrow">Stage 1 · Copy</p><p class="day-count">Day <span id="day-number">1</span></p></div>
      <h1 id="list-title">Ready?</h1>
      <p id="instructions" class="progress">Let’s learn some words!</p>

      <div id="level-progress" class="level-progress" aria-label="Stage progress"></div>

      <div id="shown-word" class="shown-word" aria-live="polite"></div>
      <button id="speak" class="speaker" type="button" aria-label="Hear the word"><span aria-hidden="true">🔊</span></button>

      <section id="letter-builder" class="letter-builder" tabindex="0" hidden aria-label="Build the word with letters">
        <p id="letter-round" class="letter-round"></p>
        <div id="built-word" class="built-word" aria-live="polite"></div>
        <div id="letter-choices" class="letter-choices"></div>
        <p class="keyboard-hint">Click a letter or press it on your keyboard</p>
      </section>

      <form id="answer-form" autocomplete="off">
        <label class="sr-only" for="answer">Enter the spelling</label>
        <div id="answer-field" class="answer-field">
          <div id="typed-display" class="typed-display" aria-hidden="true"></div>
          <input id="answer" name="answer" type="text" inputmode="text" spellcheck="false" autocapitalize="none" aria-describedby="feedback" disabled>
        </div>
        <button id="submit" class="primary" type="submit" disabled>Check my word</button>
      </form>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <section class="session-metrics" aria-labelledby="session-metrics-title">
        <div class="session-metrics-heading"><h2 id="session-metrics-title">This session</h2><a href="/progress">See history →</a></div>
        <div class="metric-grid">
          <div><strong id="session-accuracy">—</strong><span>word accuracy</span></div>
          <div><strong id="session-time">—</strong><span>avg. word time</span></div>
          <div><strong id="session-speed">—</strong><span>typing speed</span></div>
          <div><strong id="session-characters">—</strong><span>letter accuracy</span></div>
        </div>
      </section>
      <button id="restart" class="primary restart" type="button" hidden>Start a new day! 🚀</button>
    </section>
  </main>

  <script>window.SPELLING_CONFIG = {{.Config | json}};</script>
  <script src="/static/runtime.js" defer></script>
  <script src="/static/practice.js" defer></script>
</body>
</html>
